# Deployment de api-paiements, version avec sondes (probes).
# Il REMPLACE celui des ateliers précédents.
#
# Nouvelle réalité de l'appli : elle met 45 s à démarrer (connexion à la base,
# chargement du cache…). Pendant ce temps, /healthz et /readyz répondent 503.
#
# Les sondes sont exécutées par le kubelet, sur chaque conteneur :
#   liveness   « le conteneur est-il bloqué ? »          échec → redémarrage
#   readiness  « peut-il recevoir du trafic ? »          échec → retiré du Service
#   startup    « a-t-il fini de démarrer ? »             suspend les deux autres tant qu'elle n'a pas réussi
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-paiements
  labels:
    app.kubernetes.io/name: api-paiements
    app.kubernetes.io/part-of: bdc-paiements
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api-paiements
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-paiements
        app.kubernetes.io/part-of: bdc-paiements
        app.kubernetes.io/component: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: ghcr.io/evanndev/formations-kubernetes/app:1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NOM_APPLI
              value: "api-paiements"
            - name: EXIGE_VARS
              value: "DEVISE,BD_MOT_DE_PASSE"
            # Démarrage lent : sondes en 503 pendant 45 s
            - name: DELAI_DEMARRAGE
              value: "45"
          envFrom:
            - configMapRef:
                name: api-paiements-config
            - secretRef:
                name: api-paiements-secret
          # CORRECTION 1 : une startupProbe couvre le démarrage lent. Tant qu'elle
          # n'a pas réussi, liveness et readiness ne sont pas exécutées : la
          # liveness ne peut plus tuer l'appli pendant ses 45 s de démarrage.
          # Budget : periodSeconds × failureThreshold = 5 s × 15 = 75 s (45 s + marge).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 15
          # Liveness : le kubelet interroge la route toutes les periodSeconds ;
          # après failureThreshold échecs consécutifs, il redémarre le conteneur.
          livenessProbe:
            httpGet:
              # CORRECTION 3 : la liveness vérifie l'appli elle-même (/healthz), pas
              # sa capacité à servir (/readyz). Sur /readyz, une dépendance en panne
              # fait redémarrer les pods en boucle, ce qui ne répare rien.
              path: /healthz
              port: http
            # CORRECTION 1 (suite) : plus d'initialDelaySeconds, la startupProbe
            # s'en charge. La liveness reste rapide une fois l'appli démarrée :
            # redémarrage au plus 10 s × 3 = 30 s après un blocage.
            periodSeconds: 10
            failureThreshold: 3
          # Readiness : tant qu'elle échoue, le pod est retiré des endpoints du Service.
          readinessProbe:
            httpGet:
              # CORRECTION 2 : la route s'appelle /readyz ; /ready répond 404,
              # le pod n'est jamais prêt.
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
