# Secret de api-paiements — fourni ici uniquement pour le rattrapage
# (kubectl apply -f solution/). Pendant l'atelier, le Secret est créé en impératif.
#
# ⚠️ PRATIQUE À ÉVITER EN PRODUCTION : un mot de passe en clair dans un fichier
# versionné. Un Secret n'est pas chiffré : « data » est seulement encodé en base64.
# En production : External Secrets, Sealed Secrets, chiffrement etcd, etc. (F2/F3).
apiVersion: v1
kind: Secret
metadata:
  name: api-paiements-secret
  labels:
    app.kubernetes.io/name: api-paiements
    app.kubernetes.io/part-of: bdc-paiements
    app.kubernetes.io/component: backend
type: Opaque
# stringData accepte des valeurs en clair ; l'API les stocke encodées en base64 dans data.
stringData:
  # CORRECTION 3 : la clé doit s'appeler BD_MOT_DE_PASSE (exigée par EXIGE_VARS),
  # pas DB_MOT_DE_PASSE comme dans la commande de l'énoncé.
  BD_MOT_DE_PASSE: "formation-bdc"
