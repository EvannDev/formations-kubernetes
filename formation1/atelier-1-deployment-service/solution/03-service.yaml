# Service interne (ClusterIP) devant les pods de api-paiements.
# Le Service donne un nom DNS et une adresse stables ; il envoie le trafic
# aux pods dont les labels correspondent à son selector.
apiVersion: v1
kind: Service
metadata:
  name: api-paiements
  labels:
    app.kubernetes.io/name: api-paiements
    app.kubernetes.io/part-of: bdc-paiements
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  # Pods visés par le Service
  selector:
    # CORRECTION 4 : « api-paiements » avec un s, comme les labels des pods.
    # Avec « api-paiement », le Service ne trouvait aucun pod (0 endpoint).
    app.kubernetes.io/name: api-paiements
  ports:
    - name: http
      # Port exposé par le Service (http://api-paiements)
      port: 80
      # Port sur lequel l'appli écoute dans le pod
      targetPort: 8080
