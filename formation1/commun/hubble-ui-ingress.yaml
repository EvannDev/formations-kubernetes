# Ingress for Hubble UI (network flows observed by Cilium).
# Applied by installer-poste.sh.
#
# Access: http://hubble.localhost (or http://hubble.localhost:<port> behind a
# Traefik port-forward). Browsers resolve *.localhost to 127.0.0.1 without any
# configuration: no hosts file to edit.
#
# Host-based routing, not path-based: Hubble UI expects to be served at the root (/).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble-ui
  # Same namespace as the hubble-ui Service installed by Cilium
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/part-of: formation-bdc
spec:
  ingressClassName: traefik
  rules:
    - host: hubble.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  name: http
