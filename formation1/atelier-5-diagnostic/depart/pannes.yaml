# Atelier 5 — les cinq applis en panne, déployées par ./deployer-pannes.sh
# dans le namespace bdc-diagnostic.
#
# ⛔ NE PAS OUVRIR AVANT LA FIN DE L'ATELIER : le diagnostic se fait en boîte
# noire, avec kubectl uniquement.
---
# Virements Interac entrants et sortants
apiVersion: apps/v1
kind: Deployment
metadata:
  name: virements-interac
  labels:
    app.kubernetes.io/name: virements-interac
    app.kubernetes.io/part-of: bdc-paiements
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: virements-interac
  template:
    metadata:
      labels:
        app.kubernetes.io/name: virements-interac
        app.kubernetes.io/part-of: bdc-paiements
    spec:
      containers:
        - name: app
          image: ghcr.io/evanndev/formations-kubernetes/app:1.O
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NOM_APPLI
              value: "virements-interac"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: virements-interac
  labels:
    app.kubernetes.io/name: virements-interac
    app.kubernetes.io/part-of: bdc-paiements
spec:
  selector:
    app.kubernetes.io/name: virements-interac
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-client-config
  labels:
    app.kubernetes.io/name: notifications-client
    app.kubernetes.io/part-of: bdc-paiements
data:
  EXPEDITEUR: "ne-pas-repondre@bdc.ca"
---
# Courriels et notifications aux clients
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-client
  labels:
    app.kubernetes.io/name: notifications-client
    app.kubernetes.io/part-of: bdc-paiements
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifications-client
        app.kubernetes.io/part-of: bdc-paiements
    spec:
      containers:
        - name: app
          image: ghcr.io/evanndev/formations-kubernetes/app:1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NOM_APPLI
              value: "notifications-client"
            - name: EXIGE_VARS
              value: "EXPEDITEUR,URL_COURRIEL"
          envFrom:
            - configMapRef:
                name: notifications-client-config
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-client
  labels:
    app.kubernetes.io/name: notifications-client
    app.kubernetes.io/part-of: bdc-paiements
spec:
  selector:
    app.kubernetes.io/name: notifications-client
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Scoring de crédit en temps réel
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moteur-scoring
  labels:
    app.kubernetes.io/name: moteur-scoring
    app.kubernetes.io/part-of: bdc-paiements
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: moteur-scoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moteur-scoring
        app.kubernetes.io/part-of: bdc-paiements
    spec:
      # Pool de nœuds dédié aux calculs
      nodeSelector:
        bdc.ca/pool: calcul
      containers:
        - name: app
          image: ghcr.io/evanndev/formations-kubernetes/app:1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NOM_APPLI
              value: "moteur-scoring"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: moteur-scoring
  labels:
    app.kubernetes.io/name: moteur-scoring
    app.kubernetes.io/part-of: bdc-paiements
spec:
  selector:
    app.kubernetes.io/name: moteur-scoring
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Relevés transmis aux partenaires
apiVersion: apps/v1
kind: Deployment
metadata:
  name: releves-partenaires
  labels:
    app.kubernetes.io/name: releves-partenaires
    app.kubernetes.io/part-of: bdc-paiements
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: releves-partenaires
  template:
    metadata:
      labels:
        app.kubernetes.io/name: releves-partenaires
        app.kubernetes.io/part-of: bdc-paiements
    spec:
      containers:
        - name: app
          image: ghcr.io/evanndev/formations-kubernetes/app:1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NOM_APPLI
              value: "releves-partenaires"
            - name: READINESS_ECHOUE_APRES
              value: "30"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: releves-partenaires
  labels:
    app.kubernetes.io/name: releves-partenaires
    app.kubernetes.io/part-of: bdc-paiements
spec:
  selector:
    app.kubernetes.io/name: releves-partenaires
  ports:
    - name: http
      port: 80
      targetPort: http
---
