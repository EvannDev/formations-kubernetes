# Nouvelle version du Service api-paiements : elle REMPLACE celle de l'atelier 1.
# Les ports portent un nom, ce qui permet d'y faire référence sans connaître
# leur numéro (Ingress, autres Services).
apiVersion: v1
kind: Service
metadata:
  name: api-paiements
  labels:
    app.kubernetes.io/name: api-paiements
    app.kubernetes.io/part-of: bdc-paiements
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-paiements
  ports:
    # Nom du port du Service
    - name: http
      # Port exposé par le Service : http://api-paiements (port 80 implicite)
      port: 80
      # Port de destination dans les pods
      targetPort: 80
